services:
  db:
    image: postgres:17
    restart: always
    container_name: postgres
    volumes:
      - postgres_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-api:
    build: ./API
    container_name: backend_api
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    ports:
      - "8000:8000"
    volumes:
      - ./API:/app
      - ./data-pipeline/data:/opt/data
      - mlflow_artifacts:/mlflow/artifacts
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
  # ----------------------------------------------------------------
  # MLflow — serveur de tracking + model registry
  # UI accessible sur http://localhost:5000
  # Backend store : Postgres (même instance, base dédiée mlflow_db)
  # Artifact store : volume local monté dans le conteneur
  # ----------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: mlflow
    ports:
      - "5001:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/mlflow_db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    command: >
      bash -c "pip install psycopg2-binary &&
      mlflow server
      --backend-store-uri postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/mlflow_db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000"
    depends_on:
      db:
        condition: service_healthy
  # ----------------------------------------------------------------
  # ML — service d'entraînement et de monitoring
  # Ne tourne pas en continu : on l'exécute à la demande via
  #   docker compose run --rm ml python train.py
  #   docker compose run --rm ml python drift_monitor.py
  #   docker compose run --rm ml python fetch_weather.py
  #   docker compose run --rm ml python build_training_set.py
  # ----------------------------------------------------------------
  ml:
    build: ./data-pipeline/ml
    container_name: ml_trainer
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DATA_DIR=/opt/data
    env_file:
      - .env
    volumes:
      - ./data-pipeline/ml:/app
      - ./data-pipeline/data:/opt/data
      - mlflow_artifacts:/mlflow/artifacts
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started
    command: ["tail", "-f", "/dev/null"]

  # ----------------------------------------------------------------
  # Monitoring — Prometheus, Grafana, Alertmanager + exporters
  # Grafana : http://localhost:3001, Prometheus : http://localhost:9090
  # ----------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      - alertmanager
      - blackbox-exporter
      - node-exporter
      - cadvisor
      - postgres-exporter

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    command:
      - "--config.file=/etc/blackbox_exporter/blackbox.yml"
    volumes:
      - ./monitoring/blackbox:/etc/blackbox_exporter:ro

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-fanflight-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_db:
  mlflow_artifacts:
  prometheus_data:
  grafana_data:

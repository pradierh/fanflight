services:
  db:
    image: postgres:17
    restart: always
    container_name: postgres
    volumes:
      - postgres_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
      - monitoring-network

  spark-master:
    build: ./data-pipeline/spark
    container_name: spark-master
    user: root
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    env_file:
      - .env
    ports:
      - "8080:8080" # Interface Web (localhost:8080)
      - "7077:7077" # Port de communication pour les machines
    command: >
      bash -c "/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master &
      sleep 5 &&
      python3 /opt/spark/scripts/spark_listener.py"
    working_dir: /opt/spark
    volumes:
      - ./data-pipeline/spark/scripts:/opt/spark/scripts
      - ./data-pipeline/data:/opt/spark/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - monitoring-network

  spark-worker:
    build: ./data-pipeline/spark
    container_name: spark-worker
    user: root
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    env_file:
      - .env
    depends_on:
      spark-master:
        condition: service_started
    ports:
      - "8081:8081" # Interface Web du Worker (localhost:8081)
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    working_dir: /opt/spark
    volumes:
      - ./data-pipeline/spark/scripts:/opt/spark/scripts
      - ./data-pipeline/data:/opt/spark/data
    networks:
      - default
      - monitoring-network

  backend-api:
    build: ./API
    container_name: backend_api
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    ports:
      - "8000:8000"
    volumes:
      - ./API:/app
      - ./data-pipeline/data:/opt/data
      - mlflow_artifacts:/mlflow/artifacts
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - default
      - monitoring-network

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    networks:
      - default
      - monitoring-network
  # ----------------------------------------------------------------
  # MLflow — serveur de tracking + model registry
  # UI accessible sur http://localhost:5000
  # Backend store : Postgres (même instance, base dédiée mlflow_db)
  # Artifact store : volume local monté dans le conteneur
  # ----------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: mlflow
    ports:
      - "5001:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/mlflow_db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    command: >
      bash -c "pip install psycopg2-binary &&
      mlflow server
      --backend-store-uri postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/mlflow_db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - monitoring-network
  # ----------------------------------------------------------------
  # ML — service d'entraînement et de monitoring
  # Ne tourne pas en continu : on l'exécute à la demande via
  #   docker compose run --rm ml python train.py
  #   docker compose run --rm ml python drift_monitor.py
  #   docker compose run --rm ml python fetch_weather.py
  #   docker compose run --rm ml python build_training_set.py
  # ----------------------------------------------------------------
  ml:
    build: ./data-pipeline/ml
    container_name: ml_trainer
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DATA_DIR=/opt/data
    env_file:
      - .env
    volumes:
      - ./data-pipeline/ml:/app
      - ./data-pipeline/data:/opt/data
      - mlflow_artifacts:/mlflow/artifacts
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started
    command: ["tail", "-f", "/dev/null"]
    networks:
      - default
      - monitoring-network

volumes:
  postgres_db:
  mlflow_artifacts:

networks:
  monitoring-network: #monitoring
    external: true

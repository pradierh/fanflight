global:
  resolve_timeout: 5m
  smtp_smarthost: 'sandbox.smtp.mailtrap.io:2525'
  smtp_from: 'alerts@fanflight.local'
  smtp_auth_username: 'e5728a2318ff20'
  smtp_auth_password: '50cc4eabea5230'
  smtp_require_tls: true

route:
  receiver: 'email-default'
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: 'critical-with-remediation'
      continue: false
    - match:
        severity: warning
      receiver: 'email-default'

receivers:
  - name: 'email-default'
    email_configs:
      - to: 'emy@fanflight.local'
        send_resolved: true

  - name: 'critical-with-remediation'
    email_configs:
      - to: 'emy@fanflight.local'
        send_resolved: true
    webhook_configs:
      - url: 'http://backend-api:8000/webhooks/alertmanager'
        send_resolved: true
        max_alerts: 0
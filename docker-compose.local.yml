services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - postgres_db_local:/var/lib/postgresql/data
    networks:
      - default
      - monitoring-network

  spark-master:
    build:
      context: ./data-pipeline/spark
    image: tezzosyris666/fanflight-spark:local
    restart: unless-stopped
    user: root
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      API_KEY_SERAPI: ${API_KEY_SERAPI}
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master &
      sleep 5 &&
      python3 /opt/spark/scripts/spark_listener.py"
    working_dir: /opt/spark
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - default
      - monitoring-network

  spark-worker:
    build:
      context: ./data-pipeline/spark
    image: tezzosyris666/fanflight-spark:local
    restart: unless-stopped
    user: root
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      API_KEY_SERAPI: ${API_KEY_SERAPI}
    depends_on:
      spark-master:
        condition: service_started
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    working_dir: /opt/spark
    ports:
      - "8081:8081"
    networks:
      - default
      - monitoring-network

  backend-api:
    build:
      context: ./API
    image: tezzosyris666/fanflight-backend-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      API_KEY_SERAPI: ${API_KEY_SERAPI}
    ports:
      - "8000:8000"
    networks:
      - default
      - monitoring-network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_GRAFANA_URL: ${NEXT_PUBLIC_GRAFANA_URL}
        NEXT_PUBLIC_GRAFANA_DASHBOARD_UID: fanflight-app-metrics
        NEXT_PUBLIC_GRAFANA_DASHBOARD_SLUG: fanflight-metriques-applicatives
    image: tezzosyris666/fanflight-frontend:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_GRAFANA_URL: ${NEXT_PUBLIC_GRAFANA_URL}
    ports:
      - "3000:3000"
    networks:
      - default
      - monitoring-network

volumes:
  postgres_db_local:

networks:
  monitoring-network:
    external: true
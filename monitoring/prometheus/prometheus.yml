global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "/etc/prometheus/rules/fanflight-alerts.yml"

scrape_configs:
  - job_name: "backend-api"
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend-api:8000

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: "cadvisor"
    static_configs:
      - targets:
          - cadvisor:8080

name: Build and deploy application

on:
  push:
    branches:
      - main
      - master
    paths:
      - "frontend/**"
      - "API/**"
      - "data-pipeline/ml/**"
      - "monitoring/**"
      - "docker-compose.yml"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

env:
  DOCKERHUB_NAMESPACE: tezzosyris666
  FRONTEND_IMAGE: tezzosyris666/fanflight-frontend
  BACKEND_API_IMAGE: tezzosyris666/fanflight-backend-api
  ML_IMAGE: tezzosyris666/fanflight-ml
  EC2_HOST: 35.181.62.34
  EC2_USER: ubuntu
  

jobs:
  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=http://${{ env.EC2_HOST }}:8000
            NEXT_PUBLIC_GRAFANA_URL=http://${{ env.EC2_HOST }}:3001
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Build and push backend API image
        uses: docker/build-push-action@v6
        with:
          context: ./API
          file: ./API/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_API_IMAGE }}:latest
            ${{ env.BACKEND_API_IMAGE }}:${{ github.sha }}


      - name: Build and push ML image
        uses: docker/build-push-action@v6
        with:
          context: ./data-pipeline/ml
          file: ./data-pipeline/ml/Dockerfile
          push: true
          tags: |
            ${{ env.ML_IMAGE }}:latest
            ${{ env.ML_IMAGE }}:${{ github.sha }}

  deploy-ec2:
    name: Deploy compose on EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.RSA }}
        run: |
          install -m 700 -d ~/.ssh
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          key = os.environ["SSH_PRIVATE_KEY"].strip()
          if not key:
              print("Missing GitHub secret RSA. Add it in Settings > Secrets and variables > Actions.", file=sys.stderr)
              sys.exit(1)

          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")

          key = key.replace("\r\n", "\n").replace("\r", "\n")
          Path.home().joinpath(".ssh/fanflight_ec2.pem").write_text(key + "\n")
          PY
          chmod 600 ~/.ssh/fanflight_ec2.pem
          ssh-keygen -y -f ~/.ssh/fanflight_ec2.pem > /dev/null
          ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts

      - name: Copy compose file to EC2
        run: |
          scp -i ~/.ssh/fanflight_ec2.pem docker-compose.yml \
            "${EC2_USER}@${EC2_HOST}:/tmp/docker-compose.yml"

      - name: Copy monitoring config to EC2
        run: |
          ssh -i ~/.ssh/fanflight_ec2.pem "${EC2_USER}@${EC2_HOST}" \
            'rm -rf /tmp/fanflight-monitoring'
          scp -i ~/.ssh/fanflight_ec2.pem -r monitoring \
            "${EC2_USER}@${EC2_HOST}:/tmp/fanflight-monitoring"

      - name: Start or update services on EC2
        run: |
          ssh -i ~/.ssh/fanflight_ec2.pem "${EC2_USER}@${EC2_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1 || ! sudo docker compose version >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl
            curl -fsSL https://get.docker.com | sudo sh
          fi

          sudo systemctl enable --now docker
          sudo mkdir -p /opt/fanflight
          sudo mv /tmp/docker-compose.yml /opt/fanflight/docker-compose.yml
          sudo rm -rf /opt/fanflight/monitoring
          sudo mkdir -p /opt/fanflight/monitoring
          sudo cp -R /tmp/fanflight-monitoring/. /opt/fanflight/monitoring/
          sudo rm -rf /tmp/fanflight-monitoring
          if [ ! -f /opt/fanflight/.env ]; then
            sudo tee /opt/fanflight/.env >/dev/null <<'ENV'
          DB_NAME=airline_data
          DB_USER=root
          DB_PASSWORD=password_test
          DB_HOST=db
          DB_PORT=5432
          API_KEY_SERAPI=
          CORS_ORIGINS=http://localhost:3000,http://35.181.62.34
          GRAFANA_ADMIN_USER=admin
          GRAFANA_ADMIN_PASSWORD=fanflight-admin
          ENV
          fi

          # docker-compose.yml is now the same file used locally: these
          # prod-only settings (loopback-restricted monitoring ports, port 80,
          # the real /opt/fanflight/data path, the "prod" profile that enables
          # monitoring + watchtower) are added once if missing, without
          # touching secrets already present in .env from earlier deploys.
          add_if_missing() {
            sudo grep -q "^${1}=" /opt/fanflight/.env || echo "${1}=${2}" | sudo tee -a /opt/fanflight/.env >/dev/null
          }
          add_if_missing DATA_DIR_HOST /opt/fanflight/data
          add_if_missing FRONTEND_PORTS 80:3000
          add_if_missing MLFLOW_PORTS 127.0.0.1:5000:5000
          add_if_missing PROMETHEUS_PORTS 127.0.0.1:9090:9090
          add_if_missing ALERTMANAGER_PORTS 127.0.0.1:9093:9093
          add_if_missing COMPOSE_PROFILES prod

          cd /opt/fanflight
          sudo docker compose -f docker-compose.yml pull frontend backend-api ml prometheus alertmanager blackbox-exporter node-exporter cadvisor postgres-exporter grafana watchtower
          if ! sudo docker compose -f docker-compose.yml up -d --remove-orphans; then
            sudo docker compose -f docker-compose.yml ps
            sudo docker logs postgres || true
            sudo docker logs backend_api || true
            sudo docker logs prometheus || true
            sudo docker logs alertmanager || true
            sudo docker logs grafana || true
            exit 1
          fi

          # prometheus/alertmanager/grafana read their config from bind-mounted
          # files that "up -d" does not track, so restart them on every deploy
          # to pick up config changes even when their image/service spec is unchanged.
          sudo docker compose -f docker-compose.yml restart prometheus alertmanager grafana
          for url in \
            http://127.0.0.1/ \
            http://127.0.0.1:8000/ready \
            http://127.0.0.1:9090/-/ready \
            http://127.0.0.1:9093/-/healthy \
            http://127.0.0.1:3001/api/health
          do
            for attempt in $(seq 1 30); do
              if curl -fsS --max-time 5 "$url" >/dev/null; then
                echo "Health check passed: $url"
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Health check failed: $url"
                sudo docker compose -f docker-compose.yml ps
                sudo docker logs backend_api || true
                sudo docker logs prometheus || true
                sudo docker logs alertmanager || true
                sudo docker logs grafana || true
                exit 1
              fi
              sleep 5
            done
          done
          sudo docker image prune -f
          REMOTE

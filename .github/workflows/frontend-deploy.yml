name: Build and deploy application

on:
  push:
    branches:
      - main
      - master
    paths:
      - "frontend/**"
      - "API/**"
      - "data-pipeline/ml/**"
      - "monitoring/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

env:
  DOCKERHUB_NAMESPACE: tezzosyris666
  FRONTEND_IMAGE: tezzosyris666/fanflight-frontend
  BACKEND_API_IMAGE: tezzosyris666/fanflight-backend-api
  ML_IMAGE: tezzosyris666/fanflight-ml
  EC2_HOST: 35.181.62.34
  EC2_USER: ubuntu
  

jobs:
  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=http://${{ env.EC2_HOST }}:8000
            NEXT_PUBLIC_GRAFANA_URL=http://${{ env.EC2_HOST }}:3001
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Build and push backend API image
        uses: docker/build-push-action@v6
        with:
          context: ./API
          file: ./API/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_API_IMAGE }}:latest
            ${{ env.BACKEND_API_IMAGE }}:${{ github.sha }}


      - name: Build and push ML image
        uses: docker/build-push-action@v6
        with:
          context: ./data-pipeline/ml
          file: ./data-pipeline/ml/Dockerfile
          push: true
          tags: |
            ${{ env.ML_IMAGE }}:latest
            ${{ env.ML_IMAGE }}:${{ github.sha }}

  deploy-ec2:
    name: Deploy compose on EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.RSA }}
        run: |
          install -m 700 -d ~/.ssh
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          key = os.environ["SSH_PRIVATE_KEY"].strip()
          if not key:
              print("Missing GitHub secret RSA. Add it in Settings > Secrets and variables > Actions.", file=sys.stderr)
              sys.exit(1)

          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")

          key = key.replace("\r\n", "\n").replace("\r", "\n")
          Path.home().joinpath(".ssh/fanflight_ec2.pem").write_text(key + "\n")
          PY
          chmod 600 ~/.ssh/fanflight_ec2.pem
          ssh-keygen -y -f ~/.ssh/fanflight_ec2.pem > /dev/null
          ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts

      - name: Create production compose file
        run: |
          cat > fanflight-compose.yml <<EOF
          name: fanflight

          services:
            db:
              image: postgres:17
              container_name: postgres
              restart: unless-stopped
              ports:
                - "5432:5432"
              environment:
                POSTGRES_DB: \${DB_NAME}
                POSTGRES_USER: \${DB_USER}
                POSTGRES_PASSWORD: \${DB_PASSWORD}
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U \${DB_USER} -d \${DB_NAME}"]
                start_period: 30s
                interval: 5s
                timeout: 5s
                retries: 20
              volumes:
                - postgres_db:/var/lib/postgresql/data

            mlflow:
              image: ghcr.io/mlflow/mlflow:v2.13.0
              container_name: mlflow
              restart: unless-stopped
              ports:
                - "127.0.0.1:5000:5000"
              environment:
                - MLFLOW_BACKEND_STORE_URI=postgresql://\${DB_USER}:\${DB_PASSWORD}@db:5432/mlflow_db
                - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
              volumes:
                - mlflow_artifacts:/mlflow/artifacts
              command: >
                bash -c "pip install psycopg2-binary &&
                mlflow server
                --backend-store-uri postgresql://\${DB_USER}:\${DB_PASSWORD}@db:5432/mlflow_db
                --default-artifact-root /mlflow/artifacts
                --host 0.0.0.0
                --port 5000"
              depends_on:
                db:
                  condition: service_healthy

            backend-api:
              image: ${BACKEND_API_IMAGE}:latest
              container_name: backend_api
              restart: unless-stopped
              ports:
                - "8000:8000"
              environment:
                - MLFLOW_TRACKING_URI=http://mlflow:5000
              env_file:
                - .env
              volumes:
                - /opt/fanflight/data:/opt/data
                - mlflow_artifacts:/mlflow/artifacts
              depends_on:
                db:
                  condition: service_healthy
                mlflow:
                  condition: service_started
              healthcheck:
                test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)\""]
                start_period: 60s
                interval: 15s
                timeout: 5s
                retries: 10
              labels:
                - "com.centurylinklabs.watchtower.enable=true"

            ml:
              image: ${ML_IMAGE}:latest
              container_name: ml_trainer
              restart: unless-stopped
              environment:
                - MLFLOW_TRACKING_URI=http://mlflow:5000
                - DATA_DIR=/opt/data
                - PYTHONPATH=/app
              env_file:
                - .env
              volumes:
                - /opt/fanflight/data:/opt/data
                - mlflow_artifacts:/mlflow/artifacts
              working_dir: /app
              depends_on:
                db:
                  condition: service_healthy
                mlflow:
                  condition: service_started
              command: ["tail", "-f", "/dev/null"]
              labels:
                - "com.centurylinklabs.watchtower.enable=true"

            frontend:
              image: ${FRONTEND_IMAGE}:latest
              container_name: fanflight_frontend
              restart: unless-stopped
              ports:
                - "80:3000"
              environment:
                NODE_ENV: production
              healthcheck:
                test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
                start_period: 30s
                interval: 15s
                timeout: 5s
                retries: 10
              labels:
                - "com.centurylinklabs.watchtower.enable=true"

            watchtower:
              image: containrrr/watchtower:latest
              container_name: fanflight_watchtower
              restart: unless-stopped
              command: --interval 60 --cleanup --label-enable
              volumes:
                - /var/run/docker.sock:/var/run/docker.sock

            prometheus:
              image: prom/prometheus:latest
              container_name: fanflight_prometheus
              restart: unless-stopped
              ports:
                - "127.0.0.1:9090:9090"
              command:
                - "--config.file=/etc/prometheus/prometheus.yml"
                - "--storage.tsdb.path=/prometheus"
                - "--web.enable-lifecycle"
              volumes:
                - /opt/fanflight/monitoring/prometheus:/etc/prometheus:ro
                - prometheus_data:/prometheus
              depends_on:
                - blackbox-exporter
                - node-exporter
                - cadvisor
                - postgres-exporter

            blackbox-exporter:
              image: prom/blackbox-exporter:latest
              container_name: fanflight_blackbox_exporter
              restart: unless-stopped
              command:
                - "--config.file=/etc/blackbox_exporter/blackbox.yml"
              volumes:
                - /opt/fanflight/monitoring/blackbox:/etc/blackbox_exporter:ro

            node-exporter:
              image: prom/node-exporter:latest
              container_name: fanflight_node_exporter
              restart: unless-stopped
              pid: host
              command:
                - "--path.rootfs=/host"
              volumes:
                - /:/host:ro,rslave

            cadvisor:
              image: gcr.io/cadvisor/cadvisor:latest
              container_name: fanflight_cadvisor
              restart: unless-stopped
              privileged: true
              volumes:
                - /:/rootfs:ro
                - /var/run:/var/run:ro
                - /sys:/sys:ro
                - /var/lib/docker:/var/lib/docker:ro
                - /dev/disk:/dev/disk:ro

            postgres-exporter:
              image: prometheuscommunity/postgres-exporter:latest
              container_name: fanflight_postgres_exporter
              restart: unless-stopped
              environment:
                DATA_SOURCE_NAME: postgresql://\${DB_USER}:\${DB_PASSWORD}@db:5432/\${DB_NAME}?sslmode=disable
              depends_on:
                db:
                  condition: service_healthy

            grafana:
              image: grafana/grafana-oss:latest
              container_name: fanflight_grafana
              restart: unless-stopped
              ports:
                - "3001:3000"
              environment:
                GF_SECURITY_ADMIN_USER: \${GRAFANA_ADMIN_USER:-admin}
                GF_SECURITY_ADMIN_PASSWORD: \${GRAFANA_ADMIN_PASSWORD:-fanflight-admin}
                GF_USERS_ALLOW_SIGN_UP: "false"
              volumes:
                - grafana_data:/var/lib/grafana
                - /opt/fanflight/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
                - /opt/fanflight/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
              depends_on:
                - prometheus

          volumes:
            postgres_db:
            prometheus_data:
            grafana_data:
            mlflow_artifacts:
          EOF

      - name: Copy compose file to EC2
        run: |
          scp -i ~/.ssh/fanflight_ec2.pem fanflight-compose.yml \
            "${EC2_USER}@${EC2_HOST}:/tmp/fanflight-compose.yml"

      - name: Copy monitoring config to EC2
        run: |
          ssh -i ~/.ssh/fanflight_ec2.pem "${EC2_USER}@${EC2_HOST}" \
            'rm -rf /tmp/fanflight-monitoring'
          scp -i ~/.ssh/fanflight_ec2.pem -r monitoring \
            "${EC2_USER}@${EC2_HOST}:/tmp/fanflight-monitoring"

      - name: Start or update services on EC2
        run: |
          ssh -i ~/.ssh/fanflight_ec2.pem "${EC2_USER}@${EC2_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1 || ! sudo docker compose version >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl
            curl -fsSL https://get.docker.com | sudo sh
          fi

          sudo systemctl enable --now docker
          sudo mkdir -p /opt/fanflight
          sudo mv /tmp/fanflight-compose.yml /opt/fanflight/docker-compose.yml
          sudo mkdir -p /opt/fanflight/monitoring
          sudo cp -R /tmp/fanflight-monitoring/. /opt/fanflight/monitoring/
          sudo rm -rf /tmp/fanflight-monitoring
          if [ ! -f /opt/fanflight/.env ]; then
            sudo tee /opt/fanflight/.env >/dev/null <<'ENV'
          DB_NAME=airline_data
          DB_USER=root
          DB_PASSWORD=password_test
          DB_HOST=db
          DB_PORT=5432
          API_KEY_SERAPI=
          CORS_ORIGINS=http://localhost:3000,http://35.181.62.34
          GRAFANA_ADMIN_USER=admin
          GRAFANA_ADMIN_PASSWORD=fanflight-admin
          ENV
          fi

          cd /opt/fanflight
          sudo docker compose pull frontend backend-api ml prometheus blackbox-exporter node-exporter cadvisor postgres-exporter grafana
          if ! sudo docker compose up -d; then
            sudo docker compose ps
            sudo docker logs postgres || true
            sudo docker logs backend_api || true
            sudo docker logs fanflight_prometheus || true
            sudo docker logs fanflight_grafana || true
            exit 1
          fi
          for url in \
            http://127.0.0.1/ \
            http://127.0.0.1:8000/ready \
            http://127.0.0.1:9090/-/ready \
            http://127.0.0.1:3001/api/health
          do
            for attempt in $(seq 1 30); do
              if curl -fsS --max-time 5 "$url" >/dev/null; then
                echo "Health check passed: $url"
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Health check failed: $url"
                sudo docker compose ps
                sudo docker logs backend_api || true
                sudo docker logs fanflight_prometheus || true
                sudo docker logs fanflight_grafana || true
                exit 1
              fi
              sleep 5
            done
          done
          sudo docker image prune -f
          REMOTE
